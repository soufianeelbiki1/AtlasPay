server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlaspay}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:atlaspay}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:atlaspay}}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: ${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:always}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
