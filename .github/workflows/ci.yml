name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlaspay
          POSTGRES_USER: atlaspay
          POSTGRES_PASSWORD: atlaspay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlaspay -d atlaspay"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://atlaspay:atlaspay@localhost:5432/atlaspay
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Compile
        run: python -m compileall -q app tests

      - name: Migrate database
        run: python -m app.migrations

      - name: Test
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --tag atlaspay:ci .

      - name: Verify non-root runtime user
        run: test "$(docker image inspect atlaspay:ci --format '{{.Config.User}}')" = "atlaspay"
