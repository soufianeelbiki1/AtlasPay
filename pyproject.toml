[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaspay"
version = "0.1.0"
description = "Production-minded payment orchestration API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "opentelemetry-api>=1.36,<2.0",
  "prometheus-client>=0.22,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.12,<1.0",
  "hypothesis>=6.100,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]
